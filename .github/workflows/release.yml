name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Gateway
        run: ./gradlew :gateway:assemble

      - name: Package Distribution
        run: |
          mkdir -p dist/acc
          cp gateway/build/libs/gateway-1.0.0.jar dist/acc/app.jar
          cp acc.py dist/acc/
          cp requirements.txt dist/acc/
          cp -r brain dist/acc/
          cp -r config dist/acc/
          cp LICENSE dist/acc/
          cd dist && zip -r ../acc-sandbox-${{ github.ref_name }}.zip acc/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            acc-sandbox-${{ github.ref_name }}.zip
            acc.py
            LICENSE
            RELEASE_NOTES.md
          generate_release_notes: true
