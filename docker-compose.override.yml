services:
  acc-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    volumes:
      - .:/app # Mount source for hot-reloading bridge logic
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DEBUG=true

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
