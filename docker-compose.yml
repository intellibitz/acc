version: '3.8'

services:
  acc-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: acc-gateway
    ports:
      - "8333:8333"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: acc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_data:
